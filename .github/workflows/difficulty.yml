name: Luogu difficulty contracts

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m unittest discover -s tests/difficulty -p 'test_*.py' -v
