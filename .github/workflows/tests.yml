name: Skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  copy-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check skill directories and documented copy operations
        shell: bash
        run: sh .github/scripts/check-skills.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check optional retrieval helper offline
        run: python .github/scripts/test-retrieval.py
      - name: Check difficulty conversion and frozen calibration offline
        run: python .github/scripts/test-difficulty.py
      - name: Validate statement benchmark and evaluation logic offline
        run: python tests/statement/scripts/test_evaluation.py
      - name: Audit recorded statement runs and repair evidence offline
        run: python tests/statement/scripts/audit_archive.py
      - name: Audit CPScore versus direct review offline
        run: python tests/statement/scripts/compare_harness.py --audit
