name: Skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  copy-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check skill directories and documented copy operations
        shell: bash
        run: sh .github/scripts/check-skills.sh
