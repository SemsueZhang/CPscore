name: Shared review format

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shared-format:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check shared review format bundles
        run: python scripts/sync_review_format.py --check
      - name: Test format rules, review decisions and standalone review skills
        run: python -m unittest discover -s tests/editorial -v
