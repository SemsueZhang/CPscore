[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpscore"
version = "0.2.0"
description = "Evidence-based competitive-programming artifact review and deterministic scoring"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cpscore = "cpscore.cli:main"

[tool.setuptools.packages.find]
include = ["cpscore*"]

[tool.setuptools.package-data]
cpscore = ["schemas/*.json"]
